<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · EmeilSG</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", Arial, sans-serif;
        background: #f4f5f7;
        color: #222;
        padding: 16px;
      }
      main {
        max-width: 26rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 28px;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 12px 0 8px;
      }
      p {
        line-height: 1.5;
        color: #444;
        margin: 0 0 16px;
      }
      a.retry {
        display: inline-block;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 8px;
        background: #37358f;
        color: #fff;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1718;
          color: #f2f2f2;
        }
        main {
          background: #251f20;
          border-color: #3a3233;
        }
        p {
          color: #d4d4d4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        EmeilSG needs a connection to load your data and documents. Nothing you had not saved was
        sent. Check your connection and try again.
      </p>
      <a class="retry" href="/app">Try again</a>
    </main>
  </body>
</html>
