# Lint + typecheck only; no deploy step (02_TRD.md §37, 06_IMPLEMENTATION_PLAN.md Phase 1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  ocr-worker:
    name: OCR worker (ruff + extraction unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/ocr-worker/.python-version
      # Lint needs only ruff — the PaddlePaddle stack is not installed in CI.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Pure-Python extraction rules only; the PaddleOCR integration harness needs Supabase + models
      # and runs locally (python -m unittest discover -s tests/integration -t .).
      - run: python -m unittest discover -s tests/unit -t .
